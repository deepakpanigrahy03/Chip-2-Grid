<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 820" width="1660" height="820" font-family="Arial, Helvetica, sans-serif">

  <desc>Figure 2 for the TPT Proposal Planning Grant narrative. Five stations showing the
  unit conversion from joules per agentic goal to a frequency deviation at the ERCOT 138 kV
  interface. Solid boxes are measured, simulated, or externally cited; dashed boxes are
  scoped as funded next-phase work under this planning grant.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#500000"/>
    </marker>
    <marker id="arwGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6B4F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1660" height="820" fill="#FFFFFF"/>

  <!-- ============ TITLE ============ -->
  <text x="30" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#500000">One Instruction to One Megawatt</text>
  <text x="30" y="58" font-size="12.5" fill="#6B6259">Figure 2, chip to grid. Every arrow changes the unit. Solid boxes are measured, simulated, or externally cited; dashed boxes are scoped as funded next-phase work.</text>

  <!-- ============ CONVERSION LABELS (above the gaps) ============ -->
  <g font-size="10.5" fill="#500000" text-anchor="middle">
    <text x="335" y="80">x retries and</text>
    <text x="335" y="92">orchestration depth</text>
    <text x="665" y="80">x 32 tasks (sim),</text>
    <text x="665" y="92">x correlation</text>
    <text x="995" y="80">x racks per</text>
    <text x="995" y="92">facility</text>
    <text x="1325" y="80">PSCAD EMT</text>
    <text x="1325" y="92">model</text>
  </g>
  <g stroke="#C9BEB8" stroke-width="1" stroke-dasharray="2 3">
    <line x1="335" y1="100" x2="335" y2="286"/>
    <line x1="665" y1="100" x2="665" y2="286"/>
    <line x1="995" y1="100" x2="995" y2="286"/>
    <line x1="1325" y1="100" x2="1325" y2="286"/>
  </g>
  <g stroke="#500000" stroke-width="2" marker-end="url(#arw)" fill="none">
    <line x1="318" y1="300" x2="352" y2="300"/>
    <line x1="648" y1="300" x2="682" y2="300"/>
    <line x1="978" y1="300" x2="1012" y2="300"/>
    <line x1="1308" y1="300" x2="1342" y2="300"/>
  </g>

  <!-- ============ PANEL FRAMES ============ -->
  <g fill="#FFFFFF" stroke="#DDD5D0" stroke-width="1">
    <rect x="30"   y="104" width="280" height="518"/>
    <rect x="360"  y="104" width="280" height="518"/>
    <rect x="690"  y="104" width="280" height="518"/>
    <rect x="1020" y="104" width="280" height="518"/>
    <rect x="1350" y="104" width="280" height="518"/>
  </g>
  <!-- ownership edge: maroon = chip-level measurement (CSE), slate = rack-to-grid modeling (ECE) -->
  <rect x="30"   y="104" width="280" height="5" fill="#500000"/>
  <rect x="360"  y="104" width="280" height="5" fill="#500000"/>
  <rect x="690"  y="104" width="140" height="5" fill="#500000"/>
  <rect x="830"  y="104" width="140" height="5" fill="#1F4E5F"/>
  <rect x="1020" y="104" width="280" height="5" fill="#1F4E5F"/>
  <rect x="1350" y="104" width="280" height="5" fill="#1F4E5F"/>

  <!-- ============ STATION 1 - one goal ============ -->
  <text x="45" y="152" font-family="Georgia, serif" font-size="31" fill="#500000">J per goal</text>
  <text x="45" y="174" font-size="13" fill="#3D3733">One goal</text>
  <line x1="45" y1="186" x2="295" y2="186" stroke="#E5DCD7"/>

  <line x1="60" y1="345" x2="295" y2="345" stroke="#B9AEA8"/>
  <rect x="95" y="313" width="46" height="32" fill="#9A7B22"/>
  <rect x="190" y="207" width="46" height="138" fill="#500000"/>
  <text x="118" y="306" font-size="10.5" fill="#3D3733" text-anchor="middle">173.5 J</text>
  <text x="213" y="200" font-size="10.5" fill="#3D3733" text-anchor="middle">752.9 J</text>
  <text x="118" y="358" font-size="10" fill="#6B6259" text-anchor="middle">linear</text>
  <text x="213" y="358" font-size="10" fill="#6B6259" text-anchor="middle">agentic</text>

  <g font-size="10.5" fill="#3D3733">
    <text x="45" y="384">Measured, not estimated.</text>
    <text x="45" y="400">Orchestration Overhead Index 4.34x average,</text>
    <text x="45" y="416">26.48x peak on reasoning tasks.</text>
    <text x="45" y="432">3,300+ controlled runs, Intel x86 and GB10.</text>
  </g>

  <rect x="45" y="450" width="250" height="128" fill="#FBF9F8" stroke="#9A8F88" stroke-width="1"/>
  <text x="57" y="468" font-size="10.5" font-style="italic" fill="#6B6259">Exemplar selection and validity check</text>
  <g font-size="10" fill="#3D3733">
    <text x="57" y="486">Exemplar family: reasoning, 799 goals / 951</text>
    <text x="57" y="499">attempts, highest retry volume of any category.</text>
    <text x="57" y="516">0.61x tool-augmented case cited directly from</text>
    <text x="57" y="529">the published paper's frozen-snapshot analysis.</text>
  </g>
  <text x="45" y="598" font-size="9.5" fill="#500000">A-LEMS measurement -- MEASURED</text>

  <!-- ============ STATION 2 - one node ============ -->
  <text x="375" y="152" font-family="Georgia, serif" font-size="31" fill="#500000">W</text>
  <text x="375" y="174" font-size="13" fill="#3D3733">One node, time resolved</text>
  <line x1="375" y1="186" x2="625" y2="186" stroke="#E5DCD7"/>

  <text x="500" y="212" font-size="10" fill="#6B6259" text-anchor="middle">retry cascade</text>
  <line x1="390" y1="345" x2="625" y2="345" stroke="#B9AEA8"/>
  <polyline fill="none" stroke="#500000" stroke-width="2"
    points="390,322 410,322 420,246 436,246 446,320 480,320 490,228 507,228 517,318 552,318 562,238 580,238 590,316 625,316"/>
  <line x1="390" y1="332" x2="625" y2="332" stroke="#9A7B22" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="625" y="329" font-size="9" fill="#9A7B22" text-anchor="end">idle baseline</text>

  <g font-size="10.5" fill="#3D3733">
    <text x="375" y="384">The same goal, resolved in time.</text>
    <text x="375" y="400">Failed attempts and orchestration are visible</text>
    <text x="375" y="416">here and invisible to energy per inference.</text>
  </g>

  <rect x="375" y="450" width="250" height="128" fill="#FBF9F8" stroke="#9A8F88" stroke-width="1"/>
  <text x="387" y="468" font-size="10.5" font-style="italic" fill="#6B6259">Measurement provenance</text>
  <g font-size="10" fill="#3D3733">
    <text x="387" y="486">Peak 13.8 W, idle baseline 4.47 W (domain-7,</text>
    <text x="387" y="499">dcgm_field156). Two real retries traced directly</text>
    <text x="387" y="512">from raw counters, runs 769 and 223.</text>
    <text x="387" y="529">Rise time 99.4--99.8 ms, at the limit of the</text>
    <text x="387" y="542">~100 ms sampling interval; true rise may be</text>
    <text x="387" y="555">faster. This bounds, not pins, ALEOE's response.</text>
  </g>
  <text x="375" y="598" font-size="9.5" fill="#500000">A-LEMS measurement -- MEASURED</text>

  <!-- ============ STATION 3 - one rack (simulated) ============ -->
  <text x="705" y="152" font-family="Georgia, serif" font-size="31" fill="#500000">W</text>
  <text x="705" y="174" font-size="13" fill="#3D3733">One rack, 32-task proxy (pre-rack sim.)</text>
  <line x1="705" y1="186" x2="955" y2="186" stroke="#E5DCD7"/>

  <polyline fill="none" stroke="#9A7B22" stroke-width="1.6"
    points="710,300 740,294 770,304 800,296 830,302 860,295 890,303 920,297 952,301"/>
  <polyline fill="none" stroke="#500000" stroke-width="2"
    points="710,318 730,314 745,238 760,312 786,308 800,230 815,308 840,312 860,244 876,310 900,306 920,226 936,310 952,312"/>
  <text x="952" y="216" font-size="9.5" fill="#500000" text-anchor="end">correlated</text>
  <text x="952" y="340" font-size="9.5" fill="#9A7B22" text-anchor="end">independent</text>

  <g font-size="10.5" fill="#3D3733">
    <text x="705" y="384">Independent tasks average smooth. Correlated</text>
    <text x="705" y="400">retries do not: avg. peak 40.7 W to 186.8 W,</text>
    <text x="705" y="416">~4.59x, five-seed average, forced by design.</text>
  </g>

  <rect x="705" y="450" width="250" height="128" fill="#FBF9F8" stroke="#9A8F88" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="717" y="468" font-size="10.5" font-style="italic" fill="#6B6259">Simulation basis; attribution scoped Mo. 2</text>
  <g font-size="10" fill="#3D3733">
    <text x="717" y="486">40.7 W to 186.8 W built from 8 real single-</text>
    <text x="717" y="499">node traces; 12 of 32 tasks forced synchronized</text>
    <text x="717" y="512">by construction, matching the observed retries.</text>
    <text x="717" y="529">Attributing the dominant correlation mechanism</text>
    <text x="717" y="542">(rate-limit storms, batch alignment, cache</text>
    <text x="717" y="555">invalidation) is scoped as Month 2-3 profiling.</text>
  </g>
  <text x="705" y="598" font-size="9.5" fill="#500000">A-LEMS traces, simulated</text>
  <text x="955" y="598" font-size="9.5" fill="#1F4E5F" text-anchor="end">Digital Twin rack: planned</text>

  <!-- ============ STATION 4 - one facility ============ -->
  <text x="1035" y="152" font-family="Georgia, serif" font-size="31" fill="#1F4E5F">MW per second</text>
  <text x="1035" y="174" font-size="13" fill="#3D3733">One facility</text>
  <line x1="1035" y1="186" x2="1285" y2="186" stroke="#E5DCD7"/>

  <line x1="1035" y1="258" x2="1285" y2="258" stroke="#B23A2F" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="1285" y="252" font-size="9.5" fill="#B23A2F" text-anchor="end">ERCOT PGRR144: 10 MW/5s ceiling</text>
  <line x1="1040" y1="345" x2="1285" y2="345" stroke="#B9AEA8"/>
  <polyline fill="none" stroke="#500000" stroke-width="2"
    points="1040,330 1090,326 1120,224 1160,220 1190,318 1225,314 1245,228 1270,232 1285,320"/>
  <polyline fill="none" stroke="#2F6B4F" stroke-width="2"
    points="1040,332 1090,326 1130,300 1180,292 1230,296 1285,302"/>
  <text x="1285" y="316" font-size="9.5" fill="#2F6B4F" text-anchor="end">with ALEOE</text>
  <text x="1040" y="204" font-size="9" fill="#9A8F88" font-style="italic">illustrative, not yet computed</text>

  <g font-size="10.5" fill="#3D3733">
    <text x="1035" y="384">Aggregate ramp measured against ERCOT's own</text>
    <text x="1035" y="400">proposed ceiling (PGRR144): no more than 10 MW</text>
    <text x="1035" y="416">change per rolling 5-second window, per bus.</text>
  </g>

  <rect x="1035" y="450" width="250" height="128" fill="#FBF9F8" stroke="#9A8F88" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1047" y="468" font-size="10.5" font-style="italic" fill="#6B6259">Public benchmark for this project's case</text>
  <g font-size="10" fill="#3D3733">
    <text x="1047" y="486">ERCOT's proposed Large Computational Load</text>
    <text x="1047" y="499">limit: repetitive swings capped at 10 MW / 5 s</text>
    <text x="1047" y="512">(~2 MW/s sustained), evaluated 0.1-55 Hz -- a</text>
    <text x="1047" y="525">real, public Planning Guide proposal (PGRR144),</text>
    <text x="1047" y="538">not an internal assumption. What Chen's PSCAD</text>
    <text x="1047" y="551">run adds: whether this workload, scaled to a</text>
    <text x="1047" y="564">rack and facility, stays inside that ceiling.</text>
  </g>
  <text x="1035" y="598" font-size="9.5" fill="#1F4E5F">Digital Twin and EMT -- vs. ERCOT PGRR144</text>

  <!-- ============ STATION 5 - ERCOT ============ -->
  <text x="1365" y="152" font-family="Georgia, serif" font-size="31" fill="#1F4E5F">Hz</text>
  <text x="1365" y="174" font-size="13" fill="#3D3733">ERCOT 138 kV interface</text>
  <line x1="1365" y1="186" x2="1615" y2="186" stroke="#E5DCD7"/>

  <line x1="1370" y1="286" x2="1615" y2="286" stroke="#9A8F88" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1370" y="280" font-size="9.5" fill="#6B6259">60 Hz</text>
  <polyline fill="none" stroke="#1F4E5F" stroke-width="2"
    points="1370,286 1400,286 1414,232 1432,338 1450,246 1468,326 1486,258 1504,316 1522,266 1540,306 1558,274 1576,298 1594,280 1615,288"/>
  <text x="1615" y="228" font-size="9.5" fill="#1F4E5F" text-anchor="end">frequency excursion</text>
  <text x="1370" y="204" font-size="9" fill="#9A8F88" font-style="italic">illustrative, not yet run</text>

  <g font-size="10.5" fill="#3D3733">
    <text x="1365" y="384">Precedent, not hypothesis. A Dec. 2022 West</text>
    <text x="1365" y="400">Texas large-load event pushed ERCOT frequency</text>
    <text x="1365" y="416">to 60.235 Hz; NERC Level 3 Alert, May 2026 --</text>
    <text x="1365" y="432">third in 58 years. 26 million Texans, isolated grid.</text>
  </g>

  <rect x="1365" y="450" width="250" height="128" fill="#FBF9F8" stroke="#9A8F88" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1377" y="468" font-size="10.5" font-style="italic" fill="#6B6259">Grid precedent, ERCOT's own record</text>
  <g font-size="10" fill="#3D3733">
    <text x="1377" y="486">ERCOT's own event log records large-load</text>
    <text x="1377" y="499">disturbances measurably moving system</text>
    <text x="1377" y="512">frequency today (e.g. 60.086-60.235 Hz across</text>
    <text x="1377" y="525">documented 2022-2023 events) -- the risk is</text>
    <text x="1377" y="538">already on ERCOT's books. This workload's own</text>
    <text x="1377" y="551">deviation awaits Dr. Chen's PSCAD run to compute.</text>
  </g>
  <text x="1365" y="598" font-size="9.5" fill="#1F4E5F">Open-source EMT model -- run scheduled</text>

  <!-- ============ ALEOE FEEDBACK BAND ============ -->
  <rect x="30" y="642" width="1600" height="66" rx="3" fill="#F1F6F2" stroke="#CBDDD1"/>
  <path d="M 1460 676 L 760 676" fill="none" stroke="#2F6B4F" stroke-width="2.2" marker-end="url(#arwGreen)"/>
  <text x="1470" y="668" font-size="11" fill="#2F6B4F">grid constraint</text>
  <text x="1470" y="682" font-size="11" fill="#2F6B4F">enters here</text>
  <text x="55" y="668" font-size="11.5" fill="#2F6B4F">ALEOE closes the loop.</text>
  <text x="55" y="686" font-size="10.5" fill="#3D3733">Admission shaping and GPU clock locking at 100 ms restore independence</text>
  <text x="55" y="700" font-size="10.5" fill="#3D3733">before the ramp reaches the rack bus.</text>
  <text x="770" y="660" font-size="10" fill="#2F6B4F">reshaped demand returns to A-LEMS for re-measurement</text>

  <!-- ============ LEGEND ============ -->
  <rect x="30" y="732" width="16" height="9" fill="#500000"/>
  <text x="54" y="741" font-size="10.5" fill="#3D3733">Chip and node measurement -- CSE</text>

  <rect x="410" y="732" width="16" height="9" fill="#1F4E5F"/>
  <text x="434" y="741" font-size="10.5" fill="#3D3733">Rack to grid modeling -- ECE</text>

  <rect x="760" y="732" width="16" height="9" fill="#FBF9F8" stroke="#9A8F88"/>
  <text x="784" y="741" font-size="10.5" fill="#3D3733">Measured, simulated, or externally cited</text>

  <rect x="1140" y="732" width="16" height="9" fill="#FBF9F8" stroke="#9A8F88" stroke-dasharray="3 2"/>
  <text x="1164" y="741" font-size="10.5" fill="#3D3733">Scoped as funded next-phase work</text>

  <line x1="30" y1="758" x2="50" y2="758" stroke="#B23A2F" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="58" y="763" font-size="10.5" fill="#3D3733">Safe operating envelope from the EMT models</text>

  <text x="30" y="786" font-size="10" fill="#6B6259">The two integration gaps this planning grant funds sit at the third and fourth arrows: A-LEMS profiles into the Digital Twin, and rack behavior into the EMT models.</text>
  <text x="30" y="802" font-size="10" fill="#6B6259">Station 3 is a single-node-trace simulation run ahead of that integration, to understand the correlation shape before A-LEMS is deployed across a real physical rack.</text>

</svg>
